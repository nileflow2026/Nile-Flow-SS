# ──────────────────────────────────────────────────────────
# NILE FLOW — Deploy Staging (OTA Update)
# ──────────────────────────────────────────────────────────
# Trigger: Push to develop or staging branches
# Action: Build validation -> OTA publish -> Tag deployment
# ──────────────────────────────────────────────────────────

name: Deploy Staging (OTA)

on:
  push:
    branches:
      - develop
      - staging
    paths:
      - "Mobileapp/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.x"

jobs:
  validate-and-deploy:
    name: Validate and Deploy Staging OTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Mobileapp/package-lock.json

      - name: Install Dependencies
        working-directory: Mobileapp
        run: npm ci

      - name: Validate Expo Config
        working-directory: Mobileapp
        run: npx expo config --type public

      - name: Generate Fingerprint
        working-directory: Mobileapp
        run: npx @expo/fingerprint .

      - name: Validate Staging EAS Environment
        working-directory: Mobileapp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run ota:validate:staging

      - name: Publish OTA Update (Staging Channel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.sha }}
        working-directory: Mobileapp
        shell: bash
        run: 'npm run ota:staging -- --non-interactive --message "Staging OTA: $SHA"'

      - name: Tag Deployment
        env:
          TAG: staging-ota-${{ github.run_number }}
        working-directory: Mobileapp
        run: |
          git tag "${{ env.TAG }}"
          git push origin "${{ env.TAG }}"

permissions:
  contents: write
