# ──────────────────────────────────────────────────────────
# NILE FLOW — Deploy Production (OTA Update)
# ──────────────────────────────────────────────────────────
# Trigger: Push to main or manual dispatch
# Action: Approval gate -> Architecture check -> OTA deploy -> Log
# ──────────────────────────────────────────────────────────

name: Deploy Production (OTA)

on:
  push:
    branches:
      - main
    paths:
      - "Mobileapp/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type 'deploy' to confirm production OTA deployment"
        required: true
        type: choice
        options:
          - cancel
          - deploy
        default: cancel

concurrency:
  group: production-ota
  cancel-in-progress: false

env:
  NODE_VERSION: "20.x"

jobs:
  validate:
    name: Validate Production Readiness
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_deployment == 'deploy'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Mobileapp/package-lock.json
      - name: Install Dependencies
        working-directory: Mobileapp
        run: npm ci
      - name: Validate Expo Config
        working-directory: Mobileapp
        run: npx expo config --type public
      - name: Generate Fingerprint
        working-directory: Mobileapp
        run: npx @expo/fingerprint .
      - name: Run TypeScript Check
        working-directory: Mobileapp
        run: npx tsc --noEmit
      - name: Run Lint
        working-directory: Mobileapp
        run: npx eslint . --max-warnings 75
      - name: Validate Production EAS Environment
        working-directory: Mobileapp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run ota:validate:production
  production-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_deployment == 'deploy'
    environment: production
    steps:
      - name: Environment Check
        run: echo "Production environment gate passed"
      - name: Manual Approval
        run: echo "Deployment approved by ${{ github.actor }}"

  deploy-ota:
    name: Deploy OTA to Production
    runs-on: ubuntu-latest
    needs: [production-gate]
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_deployment == 'deploy'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Mobileapp/package-lock.json
      - name: Install Dependencies
        working-directory: Mobileapp
        run: npm ci
      - name: Publish OTA Update (Production Channel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.sha }}
        working-directory: Mobileapp
        run: 'npm run ota:production -- --non-interactive --message "Production OTA: $SHA"'
      - name: Tag Release
        env:
          TAG: production-ota-${{ github.run_number }}
        working-directory: Mobileapp
        run: |
          git tag "${{ env.TAG }}"
          git push origin "${{ env.TAG }}"
      - name: Log Deployment
        run: |
          echo "## Nile Flow Production OTA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel:** production" >> $GITHUB_STEP_SUMMARY

permissions:
  contents: write
