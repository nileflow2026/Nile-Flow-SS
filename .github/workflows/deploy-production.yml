# ──────────────────────────────────────────────────────────
# NILE FLOW — Deploy Production (OTA Update)
# ──────────────────────────────────────────────────────────
# Trigger: Push to main or manual dispatch
# Action: Approval gate -> Architecture check -> OTA deploy -> Log
# ──────────────────────────────────────────────────────────

name: Deploy Production (OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type 'deploy' to confirm production OTA deployment"
        required: true
        default: ""

concurrency:
  group: production-ota
  cancel-in-progress: false

env:
  NODE_VERSION: "20.x"
  WORKING_DIRECTORY: Mobileapp

jobs:
  validate:
    name: Validate Production Readiness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Validate Expo Config
        run: npx expo config --type public
      - name: Generate Fingerprint
        run: npx @expo/fingerprint .
      - name: Run TypeScript Check
        run: npx tsc --noEmit
      - name: Run Lint
        run: npx eslint . --max-warnings 50
      - name: Upload Validation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: Mobileapp/.expo/

  production-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    steps:
      - name: Environment Check
        run: echo "Production environment gate passed"
      - name: Manual Approval
        run: echo "Deployment approved by ${{ github.actor }}"

  deploy-ota:
    name: Deploy OTA to Production
    runs-on: ubuntu-latest
    needs: [production-gate]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Publish OTA Update (Production Channel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          npx eas update \
            --branch production \
            --message "Production OTA: $SHA"
      - name: Tag Release
        env:
          TAG: production-ota-${{ github.run_number }}
        run: |
          git tag "${{ env.TAG }}"
          git push origin "${{ env.TAG }}"
      - name: Log Deployment
        run: |
          echo "## Nile Flow Production OTA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel:** production" >> $GITHUB_STEP_SUMMARY
