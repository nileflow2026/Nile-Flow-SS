<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532D"/>
      <stop offset="50%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circle -->
  <circle cx="950" cy="315" r="280" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.15"/>
  <circle cx="950" cy="315" r="200" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.1"/>
  <!-- Brand name -->
  <text x="100" y="240" font-family="'Poppins', sans-serif" font-weight="900" font-size="68" fill="#FFFFFF" letter-spacing="2">NILE FLOW</text>
  <text x="100" y="310" font-family="'Poppins', sans-serif" font-weight="400" font-size="32" fill="#86EFAC" letter-spacing="4">AFRICA</text>
  <!-- Tagline -->
  <text x="100" y="400" font-family="'Poppins', sans-serif" font-weight="300" font-size="24" fill="#DCFCE7" letter-spacing="1">Premium African E-commerce</text>
  <!-- Accent line -->
  <rect x="100" y="430" width="120" height="4" rx="2" fill="url(#accent)"/>
  <!-- Decorative dots -->
  <circle cx="1060" cy="100" r="6" fill="#4ADE80" opacity="0.3"/>
  <circle cx="1100" cy="130" r="4" fill="#D97706" opacity="0.3"/>
  <circle cx="1080" cy="550" r="5" fill="#22C55E" opacity="0.2"/>
  <circle cx="1140" cy="520" r="3" fill="#F59E0B" opacity="0.25"/>
</svg>