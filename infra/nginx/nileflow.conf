# Nile Flow — NGINX Reverse Proxy Configuration
# Handles: Load balancing, edge rate limiting, response caching, DDoS protection
#
# Deploy path: /etc/nginx/sites-available/nileflow
# Activate:    ln -s /etc/nginx/sites-available/nileflow /etc/nginx/sites-enabled/
# Test:        nginx -t
# Reload:      nginx -s reload
#
# Prerequisites:
#   apt install nginx libnginx-mod-http-lua
#   snap install --classic certbot

# ── Rate Limit Zones ─────────────────────────────────────────────────────────────
# Stored in shared memory — persist across worker processes

limit_req_zone $binary_remote_addr zone=auth_zone:10m     rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:20m      rate=100r/m;
limit_req_zone $binary_remote_addr zone=payment_zone:5m   rate=20r/m;
limit_req_zone $binary_remote_addr zone=ai_zone:5m        rate=15r/m;
limit_req_zone $binary_remote_addr zone=search_zone:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=static_zone:10m   rate=300r/m;

# Per-IP connection limit
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ── Upstream Backend Pool ─────────────────────────────────────────────────────────
# Round-robin across Node.js instances (add more lines for horizontal scaling)

upstream nileflow_backend {
    least_conn;  # Route to the instance with fewest active connections
    server 127.0.0.1:3000 weight=1 max_fails=3 fail_timeout=30s;
    # Add more instances for scaling:
    # server 127.0.0.1:3001 weight=1 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:3002 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Response Cache Zone ───────────────────────────────────────────────────────────
# Cache static API responses at the edge (e.g., /api/v1/home-feed)

proxy_cache_path /var/cache/nginx/nileflow
    levels=1:2
    keys_zone=api_cache:10m
    max_size=500m
    inactive=10m
    use_temp_path=off;

# ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name nileflowafrica.com www.nileflowafrica.com api.nileflowafrica.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ─────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name nileflowafrica.com www.nileflowafrica.com api.nileflowafrica.com;

    # SSL — managed by certbot (auto-renewed)
    ssl_certificate     /etc/letsencrypt/live/nileflowafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nileflowafrica.com/privkey.pem;

    # Modern TLS only — no TLS 1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

    # ── Global Request Limits ─────────────────────────────────────────────────────
    client_max_body_size 50m;
    client_body_timeout  30s;
    client_header_timeout 10s;
    keepalive_timeout    65s;
    send_timeout         30s;

    # Max simultaneous connections per IP
    limit_conn conn_zone 20;

    # ── Block common exploit paths ────────────────────────────────────────────────
    location ~* \.(env|git|svn|htaccess|htpasswd|DS_Store)$ {
        deny all;
        return 404;
    }

    location ~* /(wp-admin|wp-login|phpmyadmin|admin\.php|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # ── Static Files (CDN should serve these in production) ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        limit_req zone=static_zone burst=100 nodelay;
        proxy_pass http://nileflow_backend;
        proxy_cache api_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    # ── Auth Routes — strict rate limiting ────────────────────────────────────────
    location ~ ^/api/(customerauth|admin/auth|vendor/auth|rider/auth) {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Payment Routes — tight rate limiting ──────────────────────────────────────
    location ~ ^/api/payments {
        limit_req zone=payment_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # Payment callbacks can be slow
    }

    # ── AI Chat Routes — token budget protection ──────────────────────────────────
    location ~ ^/api/ai {
        limit_req zone=ai_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # AI responses can take time
    }

    # ── Search Routes ─────────────────────────────────────────────────────────────
    location ~ ^/api/products/search {
        limit_req zone=search_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache         api_cache;
        proxy_cache_key     "$scheme$request_method$host$request_uri";
        proxy_cache_valid   200 30s;  # Search results: 30s edge cache
        proxy_cache_bypass  $http_cache_control;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Home Feed — aggressively cached at edge ───────────────────────────────────
    location = /api/v1/home-feed {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Cache unauthenticated home feed for 60s at edge
        # Authenticated requests bypass cache (different Cookie = different key)
        proxy_cache         api_cache;
        proxy_cache_key     "$scheme$request_method$host$request_uri$http_cookie";
        proxy_cache_valid   200 60s;
        proxy_cache_bypass  $cookie_customer_session;  # Bypass for logged-in users
        proxy_no_cache      $cookie_customer_session;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Health & Metrics — no rate limit, no cache ────────────────────────────────
    location ~ ^/(health|api/health|status|api/version) {
        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Prometheus metrics — internal only
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;  # Internal network (Grafana Cloud collector)
        deny  all;

        proxy_pass         http://nileflow_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        access_log off;
    }

    # ── All Other API Routes ──────────────────────────────────────────────────────
    location / {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://nileflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "keep-alive";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Pass correlation ID from upstream to backend
        proxy_set_header X-Correlation-ID $request_id;
    }

    # ── Custom Error Pages ────────────────────────────────────────────────────────
    error_page 429 /errors/429.json;
    error_page 502 503 504 /errors/5xx.json;

    location /errors/ {
        internal;
        root /var/www/nileflow;
        default_type application/json;
    }
}
